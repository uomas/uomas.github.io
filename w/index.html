<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UOMAS · بيانات الشباك</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* VOICE: a factory label made friendly on a phone — calm, exact, readable on site
   IDEA: the aluminium tag stuck on the window, opened up
   PICTURE: the window itself, drawn to its real proportions with its dimensions in mm
   COLOUR and TYPE: UOMAS navy, brushed aluminium, glass blue, one gold line; Cairo
   LAYOUT: tag header, number and size, drawing, profiles, where it goes */
:root{color-scheme:light dark;--bg:light-dark(#eef1f5,#0a1626);--card:light-dark(#fff,#11233a);--ink:light-dark(#0b1f33,#e8eef5);
  --muted:light-dark(#5b6b7c,#9fb2c6);--line:light-dark(#dde3ea,#21384f);--navy:#0b1f33;--gold:#e2a72e;--glass:#8fc8ea}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Cairo,"Geeza Pro",Tahoma,sans-serif;overflow-x:clip}
.tag{max-width:560px;margin:0 auto;min-height:100vh;background:var(--card)}
header{background:radial-gradient(120% 160% at 0% 0%,#1f6fa3 0%,#0b1f33 60%,#08182a 100%);color:#fff;padding:18px 20px 22px;position:relative}
header:after{content:"";position:absolute;inset-inline:0;bottom:0;height:4px;background:var(--gold)}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:36px;height:36px;flex:none}
.brand b{letter-spacing:.22em;font-size:18px}
.brand span{margin-inline-start:auto;font-size:13px;color:#c6d6e6;direction:ltr}
.hero{display:flex;align-items:flex-end;gap:14px;margin-top:16px}
.ref{font-size:52px;font-weight:800;line-height:1;direction:ltr}
.unit{font-size:15px;color:#c6d6e6;margin-bottom:6px}
.size{margin-inline-start:auto;text-align:end}
.size b{display:block;font-size:30px;font-weight:800;line-height:1.1;direction:ltr}
.size small{color:#c6d6e6}
.shape{margin-top:6px;color:#dce8f3;font-size:15px}
section{padding:18px 20px;border-bottom:1px solid var(--line)}
h2{font-size:14px;font-weight:600;color:var(--muted);margin:0 0 10px}
.fig{display:block;width:100%;height:auto}
.profiles{display:grid;gap:8px}
.prof{display:grid;grid-template-columns:84px 1fr auto;align-items:center;gap:12px;padding:8px 10px;border:1px solid var(--line);border-radius:12px}
.prof svg{width:44px;height:30px;justify-self:center}
.prof .pic{width:84px;height:56px;background:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:3px}
.prof .pic img{max-width:100%;max-height:100%;object-fit:contain}
.prof span{font-weight:600}
.prof b{font-size:17px;direction:ltr;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fact{background:light-dark(#f4f7fa,#0d1d31);border-radius:12px;padding:10px 12px}
.fact small{display:block;color:var(--muted);font-size:13px}
.fact b{font-size:16px}
.swatch{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-inline-end:6px;border:1px solid #0003}
.note{font-size:13px;color:var(--muted);text-align:center;padding:16px 20px 28px}
.err{padding:40px 20px;text-align:center}
</style>
</head>
<body>
<script src="p.js"></script>
<main class="tag" id="app"><div class="err">جاري فتح بيانات الشباك…</div></main>
<script>
{
const KIND = {f:"الحلق",s:"الضلفة",i:"الأنف + السكينة",b:"البار",x:"الفيكس",d:"الباكتة",c:"بار كلبس",w:"السلك",o:"قطاع"};
const FIN = {"":["فضي طبيعي","#c9cfd6"],white:["أبيض","#f4f5f2"],silver:["فضي","#b9c0c8"],black:["أسود","#2b2d30"],
  bronze:["برونز","#6d4c33"],wood:["خشبي","#8a5a35"],champagne:["شامبين","#cbb68f"]};
const SAMPLE = {p:"P-2026-0001",r:"W02",u:[2,3],y:"JUMBO 100",w:"180",h:"220",c:"white",n:2,fb:"50",
  k:[["f","21001420"],["s","21004110"],["i","21009510"],["b","90011500"],["x","10452082"],["d","21006120"]],l:"غرفة النوم",cu:"شركة النور",pn:"فيلا التجمع"};
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const icon = k => {
  const p = {
    f:'<path d="M4 26V8h8v10h20V8h8v18z"/>', s:'<path d="M10 4h24v22H10zM16 10v10h12V10z"/>',
    i:'<path d="M8 6h28v6H22v14h-6V12H8z"/>', b:'<path d="M20 2h4v26h-4z"/>',
    x:'<path d="M4 10h36v12H4zM10 14v4h24v-4z"/>', d:'<path d="M12 6h6v18h14v4H12z"/>',
  }[k] || '<rect x="8" y="8" width="28" height="14"/>';
  return `<svg viewBox="0 0 44 30" aria-hidden="true"><g fill="#9aa6b2" stroke="#4f5d6b" stroke-width="1">${p}</g></svg>`;
};

const pic = (k, code) => {
  const src = (window.UOMAS_PROFILES || {})[code];
  return src ? `<div class="pic"><img src="${src}" alt="${esc(code)}"></div>` : icon(k);
};

function drawing(d){
  const W = +d.w || 100, H = +d.h || 100, fh = +(d.fb || 0);
  const vw = 360, pad = 46, sc = Math.min((vw - pad - 14) / W, 260 / H);
  const w = W * sc, h = H * sc, x0 = 14, y0 = 12, fin = (FIN[d.c] || FIN[""])[1];
  const fixH = fh ? fh * sc : 0, sashH = h - fixH, n = Math.max(1, +d.n || 2), sw = w / n;
  let s = `<defs><linearGradient id="gl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#cfe8f7"/><stop offset="1" stop-color="#6fb0d8"/></linearGradient></defs>`;
  s += `<rect x="${x0}" y="${y0}" width="${w}" height="${h}" rx="2" fill="${fin}" stroke="#334" stroke-width="1.4"/>`;
  for (let i = 0; i < n; i++) {
    const x = x0 + 6 + i * (w - 12) / n, ww = (w - 12) / n + (i < n - 1 ? 3 : 0);
    s += `<rect x="${x}" y="${y0 + 6}" width="${ww}" height="${sashH - 12}" fill="${fin}" stroke="#334"/>`;
    s += `<rect x="${x + 7}" y="${y0 + 13}" width="${ww - 14}" height="${sashH - 26}" fill="url(#gl)" stroke="#456"/>`;
    const cx = x + ww / 2, cy = y0 + sashH / 2, dir = i % 2 ? 1 : -1;
    s += `<path d="M${cx - 14 * dir} ${cy} h${28 * dir} m${-7 * dir} -5 l${7 * dir} 5 l${-7 * dir} 5" stroke="#fff" stroke-width="2" fill="none"/>`;
  }
  if (fixH) {
    s += `<rect x="${x0 + 6}" y="${y0 + sashH}" width="${w - 12}" height="${fixH - 6}" fill="url(#gl)" stroke="#456"/>`;
    s += `<text x="${x0 + w / 2}" y="${y0 + sashH + fixH / 2 + 4}" font-size="11" text-anchor="middle" fill="#0b2a44">ثابت</text>`;
  }
  const dy = y0 + h + 20, dx = x0 + w + 20, mm = v => Math.round(v * 10);
  s += `<g stroke="#1f6fa3" fill="#1f6fa3" font-size="12" font-family="Cairo,sans-serif">`;
  s += `<path d="M${x0} ${dy}H${x0 + w}M${x0} ${dy - 5}v10M${x0 + w} ${dy - 5}v10"/>`;
  s += `<text x="${x0 + w / 2}" y="${dy + 16}" text-anchor="middle" stroke="none">${mm(W)}</text>`;
  s += `<path d="M${dx} ${y0}V${y0 + h}M${dx - 5} ${y0}h10M${dx - 5} ${y0 + h}h10"/>`;
  s += `<text x="${dx + 6}" y="${y0 + h / 2}" stroke="none" transform="rotate(90 ${dx + 6} ${y0 + h / 2})" text-anchor="middle">${mm(H)}</text></g>`;
  return `<svg class="fig" direction="ltr" viewBox="0 0 ${vw} ${h + y0 + 44}" role="img" aria-label="رسم الشباك ${mm(W)} في ${mm(H)} مم">${s}</svg>`;
}

function show(d, sample){
  const fin = FIN[d.c] || [d.c, "#c9cfd6"];
  const unit = d.u && d.u[1] > 1 ? `<div class="unit">${d.u[0]} من ${d.u[1]}</div>` : "";
  const profs = (d.k || []).map(([k, code]) =>
    `<div class="prof">${pic(k, code)}<span>${esc(KIND[k] || k)}</span><b>${esc(code)}</b></div>`).join("");
  document.getElementById("app").innerHTML = `
  <header>
    <div class="brand"><svg viewBox="0 0 64 64"><rect x="4" y="4" width="56" height="56" rx="12" fill="#0b1f33" stroke="#ffffff33"/><rect x="13" y="13" width="38" height="38" rx="2" fill="#c9d1da"/><rect x="17" y="17" width="14" height="30" fill="#5fa6d4"/><rect x="33" y="17" width="14" height="30" fill="#5fa6d4"/><rect x="13" y="49" width="38" height="3" fill="#e2a72e"/></svg>
      <b>UOMAS</b><span>${esc(d.p)}</span></div>
    <div class="hero"><div><div class="ref">${esc(d.r)}</div>${unit}</div>
      <div class="size"><b>${esc(d.w)} × ${esc(d.h)}</b><small>سم · عرض × ارتفاع</small></div></div>
    <div class="shape">${esc(d.s || shapeName(d))} · ${esc(d.y)}</div>
  </header>
  <section><h2>شكل الشباك (المقاسات بالمم)</h2>${drawing(d)}</section>
  ${profs ? `<section><h2>القطاعات</h2><div class="profiles">${profs}</div></section>` : ""}
  <section><div class="facts">
    <div class="fact"><small>اللون</small><b><i class="swatch" style="background:${fin[1]}"></i>${esc(fin[0])}</b></div>
    ${[["المكان", d.l], ["العميل", d.cu], ["المشروع", d.pn]].filter(x => x[1])
      .map(([k, v]) => `<div class="fact"><small>${k}</small><b>${esc(v)}</b></div>`).join("")}
  </div></section>
  <div class="note">${sample ? "ده مثال لشكل الصفحة. " : ""}يوماس — ألومنيوم وزجاج وواجهات${d.dt ? " · " + esc(d.dt) : ""}</div>`;
}

// the link carries: v1~project~window~unit/of~system~width~height~colour~sashes~fixed height~profiles
function decode(h){
  const f = decodeURIComponent(h).split(/[|~]/);
  if (f[0] !== "v1" || f.length < 11) throw new Error("bad");
  const [u1, u2] = (f[3] || "1/1").split("/").map(Number);
  return {p:f[1], r:f[2], u:[u1, u2], y:f[4], w:f[5], h:f[6], c:f[7], n:+f[8] || 2, fb:f[9],
    k:(f[10] || "").split(".").filter(Boolean).map(x => [x[0], x.slice(1)])};
}
function shapeName(d){
  return `شباك ${d.n} ${d.n > 2 ? "ضلف" : "ضلفة"} جرار` + (+d.fb ? " فوق ثابت" : "");
}

const h = location.hash.slice(1);
if (!h || h.length < 10) show(SAMPLE, true);
else { try { show(decode(h), false); } catch (e) {
  document.getElementById("app").innerHTML = '<div class="err">الكود ده مش مقروء. امسح الملصق تاني.</div>'; } }
}
</script>
</body>
</html>
